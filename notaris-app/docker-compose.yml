# Jalankan:  cp .env.example .env  (isi kunci rahasia)  lalu  docker compose up --build
# Aplikasi kantor: http://localhost:3000   Portal klien: http://localhost:3000/portal/login

x-api-env: &api-env
  # development: OTP portal dicetak di log & perintah dev-otp aktif (untuk demo).
  # Ganti ke production untuk penggunaan nyata (pasang adapter email/WhatsApp di worker).
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_URL: postgresql://notaris_app:${APP_DB_PASSWORD}@postgres:5432/notaris
  DATABASE_URL_MIGRATOR: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/notaris
  APP_DB_PASSWORD: ${APP_DB_PASSWORD}
  REDIS_URL: redis://redis:6379
  KMS_MASTER_KEY: ${KMS_MASTER_KEY}
  HMAC_KEY: ${HMAC_KEY}
  STORAGE_DIR: /data/storage
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notaris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notaris"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # Migrasi (dan data demo bila SEED_DEMO=true), lalu selesai.
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *api-env
      SEED_DEMO: ${SEED_DEMO:-true}
    command: ["sh", "-c", "node dist/db/migrate.js && if [ \"$$SEED_DEMO\" = \"true\" ]; then node dist/db/seed.js; fi"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: *api-env
    volumes:
      - storage:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    environment: *api-env
    volumes:
      - storage:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_URL: "http://api:4000" }
    ports:
      - "3000:3000"
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  storage:
